id: camera-pos-clamp-needs-inside-guard
language: TypeScript
severity: error
message: Interior position clamp is unguarded — it must check the inside membership (game.inside / game.insideMansion / mill radius) or the camera stays locked inside the house box after the player exits.
note: See openspec specs camera-system (release on exit).
files:
  - 'src/scene/CameraRig.tsx'
rule:
  any:
    - pattern: if (game.interior > 0.5) { $$$BODY }
    - pattern: if (game.interior2 > 0.5) { $$$BODY }
    - pattern: if (game.interior3 > 0.5) { $$$BODY }
