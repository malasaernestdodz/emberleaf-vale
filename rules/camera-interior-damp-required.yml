id: camera-interior-damp-required
language: TypeScript
severity: error
message: Player useFrame lost the damp(game.interior, ...) easing — the interior factor must be damped every frame for a smooth indoor↔outdoor zoom transition.
note: See openspec specs camera-system (smooth transition).
files:
  - 'src/scene/Player.tsx'
rule:
  pattern: useFrame(($$$ARGS) => { $$$BODY })
  not:
    has:
      stopBy: end
      pattern: damp(game.interior, $$$)
