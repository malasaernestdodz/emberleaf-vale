id: camera-no-direct-position-set
language: TypeScript
severity: error
message: Camera position must flow through the damped pos.current and position.copy — a direct camera.position.set skips the indoor/outdoor zoom clamps.
note: See openspec specs camera-system.
files:
  - 'src/scene/CameraRig.tsx'
rule:
  pattern: camera.position.set($$$)
